[app]
name = "pmai-core"
log_level = "INFO"

[camera]
# Camera source mode:
# - "v4l2": real USB cameras (production / Linux nativo)
# - "video_folder": each video in `video_folder_path` is treated as camera usb_0..N
source_mode = "video_folder"

# V4L2 settings (used when source_mode="v4l2")
auto_discover = true
poll_interval_seconds = 10
default_resolution = [640, 480]
default_fps = 15

# Video-folder settings (used when source_mode="video_folder")
video_folder_path = "/data"
video_extensions = [".mp4", ".avi", ".mov", ".mkv", ".webm"]
video_loop = true
video_fps = 15

[vision]
model_path = "/app/src/pmai_core/models/my_model.pt"
confidence_threshold = 0.5
device = "cpu"

[reid]
model_path = "/app/src/pmai_core/models/osnet_x0_25_msmt17.onnx"
similarity_threshold = 0.7
embedding_update_interval = 5
gallery_max_size = 1000

[pipeline]
# Interval between emitting identification results (NATS + visualization).
# Camera remains open; only result delivery is throttled.
result_interval_seconds = 5.0

[audio]
enabled = true
auto_start_listening = true
auto_select_microphone = true
preferred_microphone_id = ""
sample_rate = 16000
channels = 1
chunk_ms = 30
long_silence_ms = 1600
post_wake_grace_ms = 2200
max_recording_seconds = 20.0
min_recording_seconds = 1.0
preroll_seconds = 0.4
min_useful_transcript_chars = 14
fallback_speak_message = "No te escuche con claridad, puedes repetirlo por favor."
wake_phrases = ["hey fede", "hola fede", "federico"]
wake_partial_match = true
vosk_model_path = "/app/src/pmai_core/models/vosk-model-small-es-0.42"
poll_interval_seconds = 5.0

[nats]
url = "nats://localhost:4222"
subject_prefix = "pmai"
ms_name = "MAI_CORE_MS"
