[app]
name = "pmai-core"
log_level = "INFO"

[camera]
# Camera source mode:
# - "v4l2": real USB cameras (production / Linux nativo)
# - "video_folder": each video in `video_folder_path` is treated as camera usb_0..N
source_mode = "video_folder"

# V4L2 settings (used when source_mode="v4l2")
auto_discover = true
poll_interval_seconds = 10
default_resolution = [640, 480]
default_fps = 15

# Video-folder settings (used when source_mode="video_folder")
video_folder_path = "/data"
video_extensions = [".mp4", ".avi", ".mov", ".mkv", ".webm"]
video_loop = true
video_fps = 15

# --- Manual camera sources ---
# Optional advanced sources (stream/file/v4l2). In "video_folder" mode these are
# ignored because videos are loaded automatically from `video_folder_path`.

# Option A: IP Webcam Android app (free) → Settings → Start server.
# Replace <PHONE_IP> with your phone's actual IP on the same network.
# [[camera.sources]]
# id = "phone_cam"
# type = "stream"
# url = "http://<PHONE_IP>:8080/video"

# Option B: OBS Virtual Camera → OBS RTSP plugin.
# [[camera.sources]]
# id = "obs_cam"
# type = "stream"
# url = "rtsp://host.docker.internal:8554/live"

# Option C: Local video file for offline testing.
# [[camera.sources]]
# id = "test_cam_1"
# type = "file"
# path = "/data/test_video.mp4"
# fps = 15
# loop = true

# Option D: Second file to test cross-camera ReID.
# [[camera.sources]]
# id = "test_cam_2"
# type = "file"
# path = "/data/test_video_2.mp4"
# fps = 15
# loop = true

[vision]
model_path = "/app/src/pmai_core/models/my_model.pt"
confidence_threshold = 0.5
device = "cpu"

[reid]
model_path = "/app/src/pmai_core/models/osnet_x0_25_msmt17.onnx"
similarity_threshold = 0.7
embedding_update_interval = 5
gallery_max_size = 1000

[pipeline]
# Interval between emitting identification results (NATS + visualization).
# Camera remains open; only result delivery is throttled.
result_interval_seconds = 5.0

[nats]
url = "nats://localhost:4222"
subject_prefix = "pmai"

[api]
host = "0.0.0.0"
port = 8000
