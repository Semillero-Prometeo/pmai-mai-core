[app]
name = "pmai-core"
log_level = "INFO"

[camera]
# V4L2 auto-discovery works on native Linux (production mini-PC).
# In WSL2+Docker, V4L2 streaming is broken (VHCI isochronous limitation).
# Set to false and use [[camera.sources]] instead for development.
auto_discover = false
poll_interval_seconds = 10
default_resolution = [640, 480]
default_fps = 15

# --- Manual camera sources ---
# For development on WSL2, use a stream or video file.
# In production, set auto_discover = true and remove these.

# Option A: IP Webcam Android app (free) → Settings → Start server.
# Replace <PHONE_IP> with your phone's actual IP on the same network.
# [[camera.sources]]
# id = "phone_cam"
# type = "stream"
# url = "http://<PHONE_IP>:8080/video"

# Option B: OBS Virtual Camera → OBS RTSP plugin.
# [[camera.sources]]
# id = "obs_cam"
# type = "stream"
# url = "rtsp://host.docker.internal:8554/live"

# Option C: Local video file for offline testing.
[[camera.sources]]
id = "test_cam_1"
type = "file"
path = "/data/test_video.mp4"
fps = 15
loop = true

# Option D: Second file to test cross-camera ReID.
# [[camera.sources]]
# id = "test_cam_2"
# type = "file"
# path = "/data/test_video_2.mp4"
# fps = 15
# loop = true

[vision]
model_path = "/app/src/pmai_core/models/my_model.pt"
confidence_threshold = 0.5
device = "cpu"

[reid]
model_path = "/app/src/pmai_core/models/osnet_x0_25_msmt17.onnx"
similarity_threshold = 0.7
embedding_update_interval = 5
gallery_max_size = 1000

[pipeline]
# Seconds to wait between iterations of the main `run` loop.
# 0.0 means "lo más rápido posible".
loop_interval_seconds = 5.0

[nats]
url = "nats://localhost:4222"
subject_prefix = "pmai"

[api]
host = "0.0.0.0"
port = 8000
